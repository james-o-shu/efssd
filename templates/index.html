{% extends "base.html" %}

{% block title %}Blog Posts{% endblock %}

{% block content %}
  <h1>Blog Posts</h1>
  {% for post in posts %}
    <div class="post">
      <h2><a href="/post/{{ post.id }}">{{ post.title }}</a></h2>
      <p>By {{ post.author }}</p>
    </div>
  {% endfor %}
{% endblock %}
